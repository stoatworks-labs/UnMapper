[workspace]
resolver = "2"
members = [
    "crates/diag",
    "crates/unmapper-core",
    "crates/unmapper-resolume",
    "crates/unmapper-stagefile",
    "crates/unmapper-ndi",
    "crates/unmapper-render",
    "crates/unmapper-app",
    "crates/unmapper-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Allan Sargeant"]
repository = "https://github.com/stoatworks-labs/UnMapper"

# Version skew between egui-wgpu and wgpu is the classic failure here: two wgpu
# versions in one tree compile fine and then refuse to share a Device, because
# `wgpu::Device` from 29 and from 30 are different types. egui-wgpu 0.35 depends
# on wgpu 29, so wgpu is pinned to 29 rather than left to float to the newest.
# If you bump egui, re-check with:
#     cargo tree | grep -oE '(^|[^-])wgpu v[0-9.]+'
# and make sure exactly one version comes back.
[workspace.dependencies]
egui = "0.35.0"
egui-wgpu = "0.35.0"
egui-winit = "0.35.0"
wgpu = "29"
winit = "0.30.13"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.30", features = ["serde"] }
pollster = "1.0"
libloading = "0.9"
parking_lot = "0.12"
