[package]
name = "unmapper-gui"
description = "UnMapper's desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "unmapper-gui"
path = "src/main.rs"

[dependencies]
unmapper-core = { path = "../unmapper-core" }
unmapper-resolume = { path = "../unmapper-resolume" }
unmapper-stagefile = { path = "../unmapper-stagefile" }
unmapper-ndi = { path = "../unmapper-ndi" }
unmapper-render = { path = "../unmapper-render" }
diag = { path = "../diag" }

egui = { workspace = true }
egui-wgpu = { workspace = true }
egui-winit = { workspace = true }
wgpu = { workspace = true }
winit = { workspace = true }
glam = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
pollster = { workspace = true }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
