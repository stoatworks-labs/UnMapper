[package]
name = "unmapper-app"
description = "UnMapper — recreate an LED rig from a Resolume slice map and play NDI onto it"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "unmapper"
path = "src/main.rs"

[dependencies]
unmapper-core = { path = "../unmapper-core" }
unmapper-resolume = { path = "../unmapper-resolume" }
unmapper-ndi = { path = "../unmapper-ndi" }
unmapper-render = { path = "../unmapper-render" }
diag = { path = "../diag" }

anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
glam = { workspace = true }
